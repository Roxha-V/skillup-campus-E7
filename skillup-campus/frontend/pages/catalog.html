<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos los cursos · SkillUp Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/style.css">
  <style>
    .course-card__image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a class="navbar__logo" href="../index.html">
      <img class="navbar__logo-img" src="../src/assets/icons/logo-skillup.png" alt="SkillUp Campus">
    </a>
    <nav class="navbar__links">
      <div class="navbar__dropdown">
        <button type="button" class="navbar__dropdown-toggle" aria-expanded="false" aria-controls="cursos-menu">
          Cursos <span class="navbar__dropdown-arrow">▾</span>
        </button>
        <div class="navbar__dropdown-menu" id="cursos-menu">
          <a href="catalog.html">Todos</a>
          <a href="catalog.html?categoria=diseno">Diseño</a>
          <a href="catalog.html?categoria=negocios">Negocios</a>
          <a href="catalog.html?categoria=tecnologia">Tecnología</a>
          <a href="catalog.html?categoria=marketing">Marketing</a>
          <a href="catalog.html?categoria=productividad">Productividad</a>
        </div>
      </div>
      <a href="../index.html#about">Sobre nosotros</a>
    </nav>
    <div class="navbar__search">
      🔍
      <input type="search" placeholder="Buscar cursos">
    </div>
    <div class="navbar__actions">
      <a class="btn btn-outline" href="login.html">Iniciar sesión</a>
      <a class="btn btn-primary" href="register.html">Regístrate</a>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-header__title">Todos los cursos</h1>
      <p class="page-header__subtitle">Encuentra el curso perfecto para ti</p>
    </div>

    <div class="catalog-toolbar">
      <div class="search-bar">
        🔍
        <input type="search" placeholder="Buscar cursos">
      </div>
      <button type="button" class="filters-btn">☰ Filtros</button>
    </div>

    <div class="catalog-layout">
      <aside class="categories">
        <p class="categories__title">Categorías</p>
        <a href="#" class="is-active">Todos</a>
        <a href="#">Diseño</a>
        <a href="#">Tecnología</a>
        <a href="#">Negocios</a>
        <a href="#">Marketing</a>
        <a href="#">Productividad</a>
        <a href="#">Con descuento</a>
      </aside>

      <section>
        <div class="course-grid" id="catalog-grid"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__content">
      <span>© 2026 SkillUp. Todos los derechos reservados.</span>
      <div class="footer__social">
        <a href="#" aria-label="Facebook"><img src="../src/assets/icons/icon-facebook.png" alt=""></a>
        <a href="#" aria-label="YouTube"><img src="../src/assets/icons/icon-youtube.png" alt=""></a>
        <a href="#" aria-label="LinkedIn"><img src="../src/assets/icons/icon-linkedin.png" alt=""></a>
      </div>
    </div>
  </footer>

  <script src="../src/js/main.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/catalog.js"></script>
</body>
</html>
