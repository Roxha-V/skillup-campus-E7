<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta · SkillUp Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/style.css">
</head>
<body>
  <header class="navbar">
    <a class="navbar__logo" href="../index.html">
      <img class="navbar__logo-img" src="../src/assets/icons/logo-skillup.png" alt="SkillUp Campus">
    </a>
    <nav class="navbar__links">
      <div class="navbar__dropdown">
        <button type="button" class="navbar__dropdown-toggle" aria-expanded="false" aria-controls="cursos-menu">
          Cursos <span class="navbar__dropdown-arrow">▾</span>
        </button>
        <div class="navbar__dropdown-menu" id="cursos-menu">
          <a href="catalog.html">Todos</a>
          <a href="catalog.html?categoria=diseno">Diseño</a>
          <a href="catalog.html?categoria=negocios">Negocios</a>
          <a href="catalog.html?categoria=tecnologia">Tecnología</a>
          <a href="catalog.html?categoria=marketing">Marketing</a>
          <a href="catalog.html?categoria=productividad">Productividad</a>
        </div>
      </div>
      <a href="../index.html#about">Sobre nosotros</a>
    </nav>
    <div class="navbar__search">
      🔍
      <input type="search" placeholder="Buscar cursos">
    </div>
    <div class="navbar__actions">
      <a class="btn btn-outline" href="login.html">Iniciar sesión</a>
      <a class="btn btn-primary" href="register.html">Regístrate</a>
    </div>
  </header>

  <main class="auth">
    <div class="auth__form-wrapper">
      <h1 class="auth__title">Crea tu cuenta</h1>
      <p class="auth__subtitle">Empieza a aprender algo nuevo</p>

      <form class="auth__form" novalidate>
        <div class="form-group">
          <label for="first-name">Nombre</label>
          <input type="text" id="first-name" name="first-name" placeholder="Ingresa tu nombre completo" required>
        </div>

        <div class="form-group">
          <label for="last-name">Apellido</label>
          <input type="text" id="last-name" name="last-name" placeholder="Ingresa tus apellidos" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="field-wrapper">
            <input type="password" id="password" name="password" placeholder="Crea contraseña" minlength="8" required>
            <button type="button" class="field-toggle" id="toggle-password" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirmar contraseña</label>
          <div class="field-wrapper">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmar tu contraseña" minlength="8" required>
            <button type="button" class="field-toggle" id="toggle-confirm-password" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>

        <label class="form-check">
          <input type="checkbox" id="terms" name="terms" required>
          Acepto los términos y condiciones y la <a href="#">Política de privacidad</a>
        </label>

        <button type="submit" class="btn btn-primary">Crear cuenta</button>
      </form>

      <a class="auth__back" href="../index.html">← Volver al inicio</a>
    </div>

    <aside class="auth__aside" aria-hidden="true">
      <img src="../src/assets/images/auth-register-illustration.png" alt="">
    </aside>
  </main>

  <footer class="footer">
    <div class="footer__content">
      <span>© 2026 SkillUp. Todos los derechos reservados.</span>
      <div class="footer__social">
        <a href="#" aria-label="Facebook"><img src="../src/assets/icons/icon-facebook.png" alt=""></a>
        <a href="#" aria-label="YouTube"><img src="../src/assets/icons/icon-youtube.png" alt=""></a>
        <a href="#" aria-label="LinkedIn"><img src="../src/assets/icons/icon-linkedin.png" alt=""></a>
      </div>
    </div>
  </footer>

  <script src="../src/js/main.js"></script>
  <script>
    togglePasswordVisibility('toggle-password', 'password');
    togglePasswordVisibility('toggle-confirm-password', 'confirm-password');
  </script>
</body>
</html>
